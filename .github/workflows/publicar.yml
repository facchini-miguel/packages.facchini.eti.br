# Builds the signed apt (/<name>/deb) and dnf/zypper (/<name>/rpm) repositories of each software
# from the packages attached to its GitHub releases (baixar.sh, construir.sh) and publishes them with site/ on
# GitHub Pages, at https://packages.facchini.eti.br. Runs on every push, every hour (a new
# release shows up within the hour; nothing is published when no package changed), and by hand.
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Pacotes dos releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./baixar.sh
      - name: Algo mudou?
        id: mudou
        run: |
          (cd pacotes && ls -- */*.deb */*.rpm) | sort >versoes.txt
          publicados=$(curl -fsS https://packages.facchini.eti.br/versoes.txt || true)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$publicados" = "$(cat versoes.txt)" ]; then
            echo "Nenhum pacote novo."
            echo "publicar=" >>"$GITHUB_OUTPUT"
          else
            echo "publicar=1" >>"$GITHUB_OUTPUT"
          fi
      - name: Ferramentas
        if: steps.mudou.outputs.publicar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends apt-utils createrepo-c rpm
      - name: Repositórios assinados
        if: steps.mudou.outputs.publicar
        env:
          GPG_CHAVE_PRIVADA: ${{ secrets.GPG_CHAVE_PRIVADA }}
        run: ./construir.sh
      - if: steps.mudou.outputs.publicar
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - id: pages
        if: steps.mudou.outputs.publicar
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
